<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare - Pacientes</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>MindCare</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="agenda.html">
                            <i class="fas fa-calendar-alt"></i>
                            <span>Agenda</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="pacientes.html">
                            <i class="fas fa-users"></i>
                            <span>Pacientes</span>
                        </a>
                    </li>
                    <li>
                        <a href="financeiro.html">
                            <i class="fas fa-wallet"></i>
                            <span>Financeiro</span>
                        </a>
                    </li>
                    <li>
                        <a href="relatorios.html">
                            <i class="fas fa-chart-bar"></i>
                            <span>Relatórios</span>
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <i class="fas fa-cog"></i>
                            <span>Configurações</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="[ui-avatars.com](https://ui-avatars.com/api/?name=Dr+Silva&background=6366f1&color=fff)" alt="Avatar" class="user-avatar">
                    <div class="user-details">
                        <span class="user-name">Dr. Silva</span>
                        <span class="user-role">Psicólogo</span>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title">
                        <h1>Pacientes</h1>
                        <p>Gerencie seus pacientes</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn-primary" id="btnNovoPaciente">
                        <i class="fas fa-plus"></i>
                        Novo Paciente
                    </button>
                </div>
            </header>
            
            <!-- Content -->
            <div class="page-content">
                <!-- Filters -->
                <div class="filters-bar">
                    <div class="search-filter">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchPaciente" placeholder="Buscar por nome, email ou telefone...">
                    </div>
                    <div class="filter-group">
                        <select id="filterStatus">
                            <option value="">Todos os status</option>
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                            <option value="alta">Alta</option>
                        </select>
                        <select id="filterTratamento">
                            <option value="">Todos os tratamentos</option>
                            <option value="individual">Terapia Individual</option>
                            <option value="casal">Terapia de Casal</option>
                            <option value="grupo">Terapia em Grupo</option>
                            <option value="avaliacao">Avaliação</option>
                        </select>
                    </div>
                </div>
                
                <!-- Patients Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="data-table" id="pacientesTable">
                            <thead>
                                <tr>
                                    <th>Paciente</th>
                                    <th>Contato</th>
                                    <th>Tratamento</th>
                                    <th>Sessões</th>
                                    <th>Status</th>
                                    <th>Última Sessão</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="pacientesTableBody">
                                <!-- Dados serão inseridos via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination">
                        <span class="pagination-info">Mostrando 1-10 de 127 pacientes</span>
                        <div class="pagination-controls">
                            <button class="btn-pagination" disabled>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="btn-pagination active">1</button>
                            <button class="btn-pagination">2</button>
                            <button class="btn-pagination">3</button>
                            <span>...</span>
                            <button class="btn-pagination">13</button>
                            <button class="btn-pagination">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Modal Novo/Editar Paciente -->
    <div class="modal-overlay" id="modalPaciente">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Paciente</h2>
                <button class="btn-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="formPaciente">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <div class="form-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">E-mail *</label>
                            <input type="email" id="emailPaciente" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento">
                        </div>
                        <div class="form-group">
                            <label for="genero">Gênero</label>
                            <select id="genero" name="genero">
                                <option value="">Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                                <option value="prefiro_nao_dizer">Prefiro não dizer</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tratamento">Tipo de Tratamento</label>
                            <select id="tratamento" name="tratamento">
                                <option value="individual">Terapia Individual</option>
                                <option value="casal">Terapia de Casal</option>
                                <option value="grupo">Terapia em Grupo</option>
                                <option value="avaliacao">Avaliação Psicológica</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="valorSessao">Valor da Sessão (R$)</label>
                            <input type="number" id="valorSessao" name="valorSessao" value="250.00" step="0.01">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade">
                    </div>
                    
                    <div class="form-group">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" rows="3" placeholder="Anotações iniciais sobre o paciente..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancelModal">Cancelar</button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i>
                        Salvar Paciente
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal Visualizar Paciente -->
    <div class="modal-overlay" id="modalVisualizarPaciente">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2>Detalhes do Paciente</h2>
                <button class="btn-close" id="closeModalVisualizar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="patient-profile" id="patientProfile">
                    <!-- Conteúdo será preenchido via JS -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span class="toast-message">Mensagem</span>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/pacientes.js"></script>
</body>
</html>
